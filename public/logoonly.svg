<svg
  width="100%"
  height="100%"
  viewBox="0 0 100 100"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Glow Filters -->
  <defs>
    <filter id="neon-glow-logo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#neon-glow-logo)">
    <!-- Hexagon Top -->
    <polygon
      points="50,12 62,19 62,33 50,40 38,33 38,19"
      stroke="#00f0ff"
      stroke-width="4"
      fill="rgba(0, 240, 255, 0.05)"
      stroke-linejoin="round"
    />

    <!-- Hexagon Bottom Left -->
    <polygon
      points="24,57 36,64 36,78 24,85 12,78 12,64"
      stroke="#00f0ff"
      stroke-width="4"
      fill="rgba(0, 240, 255, 0.05)"
      stroke-linejoin="round"
    />

    <!-- Hexagon Bottom Right -->
    <polygon
      points="76,57 88,64 88,78 76,85 64,78 64,64"
      stroke="#00f0ff"
      stroke-width="4"
      fill="rgba(0, 240, 255, 0.05)"
      stroke-linejoin="round"
    />

    <!-- Center Connection Hub -->
    <circle
      cx="50"
      cy="53"
      r="7"
      stroke="#00f0ff"
      stroke-width="4"
      
    />

    <!-- Connection Lines -->
    <!-- Central hub to Top Hexagon -->
    <line
      x1="50"
      y1="46"
      x2="50"
      y2="33"
      stroke="#00f0ff"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Central hub to Bottom Left Hexagon -->
    <line
      x1="44"
      y1="56"
      x2="31"
      y2="64"
      stroke="#00f0ff"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Central hub to Bottom Right Hexagon -->
    <line
      x1="56"
      y1="56"
      x2="69"
      y2="64"
      stroke="#00f0ff"
      stroke-width="4"
      stroke-linecap="round"
    />

    <!-- Subtle Outer Radar Lines -->
    <circle
      cx="50"
      cy="53"
      r="38"
      stroke="#849495"
      stroke-width="1"
      stroke-dasharray="4 6"
      opacity="0.35"
    />
  </g>
</svg>
